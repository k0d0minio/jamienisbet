# ci: the client checks, defined once in legible-consulting/.github (CI is
# truth; never run locally).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: legible-consulting/.github/.github/workflows/check-client.yml@main
