# ci: the client checks and the release, defined once in legible-consulting/.github (CI is
# truth; never run locally).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: legible-consulting/.github/.github/workflows/check-client.yml@main

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    uses: legible-consulting/.github/.github/workflows/release.yml@main
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
