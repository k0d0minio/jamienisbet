<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0}
  .og{width:1200px;height:630px;box-sizing:border-box;background:var(--neutral-950);color:#fff;
    font-family:var(--font-sans);padding:80px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px}

  .top .mk{color:var(--blue-300);display:inline-flex}
  .top span{font-size:26px;font-weight:600;letter-spacing:-.01em}
  .eyebrow{font-family:var(--font-mono);font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-300);margin-bottom:24px}
  h1{font-size:72px;font-weight:600;letter-spacing:-.03em;line-height:1.02;margin:0;max-width:900px}
  .foot{font-family:var(--font-mono);font-size:18px;color:var(--neutral-400);letter-spacing:.04em;display:flex;gap:28px}
</style></head>
<body>
<div class="og">
  <div class="top">
    <span class="mk"><svg width="40" height="40" viewBox="0 0 100 100" fill="none"><g stroke="currentColor" stroke-width="6" stroke-linecap="round"><path d="M30 32 L70 50 M30 68 L70 50"/></g><g fill="currentColor"><circle cx="30" cy="32" r="9"/><circle cx="30" cy="68" r="9"/><circle cx="72" cy="50" r="11"/></g></svg></span>
    <span>Jamie <span style="font-weight:300">Nisbet</span></span>
  </div>
  <div>
    <div class="eyebrow">AI Infrastructure · Freelance</div>
    <h1>Quiet, considered systems for teams that can&rsquo;t afford downtime.</h1>
  </div>
  <div class="foot"><span>jamienisbet.dev</span><span>hello@jamienisbet.dev</span></div>
</div>
</body></html>
