<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3A5A78" />
    <title>Offline — Consultancy JN</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #f7f8f9;
        color: #15181c;
        font-family:
          "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
      }
      .mark {
        width: 56px;
        height: 56px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0;
      }
      p {
        margin: 0;
        max-width: 22rem;
        color: #4c545d;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      button {
        margin-top: 0.5rem;
        border: 0;
        border-radius: 6px;
        background: #3a5a78;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 0.6rem 1.2rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="100" height="100" rx="22" fill="#3a5a78" />
      <g stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M28 32 H44 M40 32 V58 Q40 69 29 69 Q21 69 21 60" />
        <path d="M56 70 V34 L78 70 V34" />
      </g>
    </svg>
    <h1>You're offline</h1>
    <p>
      Consultancy JN needs a connection to reach your live business data. Check
      your network and try again.
    </p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
