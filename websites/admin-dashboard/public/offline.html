<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFEFA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1E1E1E" />
    <title>Offline — Consultancy JN</title>
    <!--
      The one page in the app that cannot read a token: it is served by the
      service worker with no stylesheet, so every value here is a literal copy
      of one. Kept in step with the app it stands in for — the app tier's
      system font stack and native sizes, and both appearances, since the app
      follows the system and this page is the only thing the owner sees when
      the network is gone.
    -->
    <style>
      :root {
        color-scheme: light dark;
        /* --bg / --text-1 / --text-2 / --primary / --primary-fg, light:
           the logo's paper and ink. */
        --page: #fffefa;
        --label: #1e1e1e;
        --label-2: #4f4e4b;
        --tint: #1e1e1e;
        --on-tint: #fffefa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          /* The same five, dark: ink canvas, paper type and tint. */
          --page: #1e1e1e;
          --label: #fffefa;
          --label-2: #b9b8b2;
          --tint: #fffefa;
          --on-tint: #1e1e1e;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        /* `viewport-fit=cover` runs the window under the notch and the home
           indicator, and this page is only ever seen in the installed app —
           where there is no browser chrome to keep it out of them. */
        padding: calc(2rem + env(safe-area-inset-top, 0px))
          calc(1rem + env(safe-area-inset-right, 0px))
          calc(2rem + env(safe-area-inset-bottom, 0px))
          calc(1rem + env(safe-area-inset-left, 0px));
        text-align: center;
        background: var(--page);
        color: var(--label);
        /* The app tier's face: the system stack, not the marketing one. */
        font-family:
          system-ui, -apple-system, "SF Pro Text", "Segoe UI Variable Text",
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mark {
        width: 56px;
        height: 56px;
      }
      h1 {
        /* title-3 / 20 on the native scale. */
        font-size: 1.25rem;
        line-height: 1.5625rem;
        letter-spacing: -0.018em;
        font-weight: 700;
        margin: 0;
      }
      p {
        margin: 0;
        max-width: 22rem;
        color: var(--label-2);
        /* subhead / 15. */
        font-size: 0.9375rem;
        line-height: 1.25rem;
      }
      button {
        margin-top: 0.5rem;
        border: 0;
        /* The tier draws focus inside a control, because the app it stands in
           for is built out of surfaces that clip. Matched here so the two
           screens don't disagree about what "focused" looks like. */
        outline-offset: -2px;
        /* --app-radius-control. */
        border-radius: 12px;
        background: var(--tint);
        color: var(--on-tint);
        font: inherit;
        font-weight: 600;
        /* The 44px touch floor. */
        min-height: 2.75rem;
        padding: 0.6rem 1.2rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- The icon form, in currentColor: the JN letters inside the frame, traced
         from the artwork (packages/ui/src/components/brand/logo-artwork.ts) so
         this page shows the same logo as the app it stands in for. -->
    <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="currentColor">
      <path d="M0 0H100V100H0ZM2.09 2.09V97.91H97.91V2.09Z" fill-rule="evenodd" />
      <path d="M22.02 79.92C21.36 79.88 20.42 79.76 19.63 79.60C16.84 79.03 14.43 77.83 12.07 75.83C11.44 75.29 9.92 73.75 9.40 73.10L9.01 72.62L9.92 71.72C10.42 71.22 11.89 69.76 13.19 68.48L15.56 66.14L16.43 67.01C18.30 68.86 19.23 69.60 20.28 70.04C21.19 70.42 22.44 70.61 23.20 70.47C24.49 70.24 25.47 69.21 25.85 67.70C26.15 66.51 26.14 67.27 26.16 47.13L26.18 28.03L30.99 28.03L35.80 28.03L35.78 47.46C35.76 65.64 35.75 66.96 35.64 67.81C35.18 71.48 34.25 74.03 32.62 76.13C30.51 78.85 26.87 80.15 22.02 79.92ZM43.85 53.37L43.85 28.03L48.48 28.03L53.11 28.03L61.35 40.65C65.89 47.60 70.76 55.05 72.18 57.23L74.77 61.18L74.79 44.60L74.80 28.03L79.65 28.03L84.49 28.03L84.49 53.37L84.49 78.72L79.85 78.72L75.20 78.72L75.05 78.50C74.96 78.39 70.09 70.93 64.23 61.94L53.57 45.59L53.53 62.14L53.50 78.68L48.67 78.70L43.85 78.72L43.85 53.37Z" />
    </svg>
    <h1>You're offline</h1>
    <p>
      Consultancy JN needs a connection to reach your live business data. Check
      your network and try again.
    </p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
